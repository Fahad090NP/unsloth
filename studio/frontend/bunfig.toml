# Bun configuration for the Unsloth frontend.
# Bun owns local installs, script running and formatting. npm stays available
# for CI and for the release tooling that still consumes package-lock.json.

[install]
# Node tooling in this repository expects a hoisted tree.
linker = "hoisted"

[fmt]
# Matches the formatting the frontend has always used, so `bun fmt` is a
# drop-in replacement for Prettier without a second configuration file.
printWidth = 80
tabWidth = 2
useTabs = false
semi = true
singleQuote = false
quoteProps = "as-needed"
trailingComma = "all"
arrowParens = "always"
bracketSpacing = true
bracketSameLine = false
endOfLine = "lf"
insertFinalNewline = true
